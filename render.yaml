services:
  - type: web
    name: incruiter-integrity-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/sessions
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SERVE_WEB
        value: "false"
      - key: RENDER
        value: "true"
      - key: FRONTEND_URL
        sync: false
